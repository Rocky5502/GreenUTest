[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenutest"
version = "0.1.0.dev0"
description = "Uncertainty-guided, energy-adaptive LLM software testing research harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "GreenUTest contributors"}]
keywords = ["software-testing", "llm", "uncertainty", "calibration", "energy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
]
analysis = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]
energy = [
  "nvidia-ml-py>=12.560.30",
]
local-hf = [
  "torch>=2.4",
  "transformers>=4.44",
  "accelerate>=0.33",
  "sentencepiece>=0.2",
]
benchmarks = [
  "pytest>=8.3",
  "pytest-cov>=5",
]

[project.scripts]
greenutest = "greenutest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["external", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = "^(external|artifacts|results)/"
